name: Release installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test history and preferences
        run: bash scripts/test.sh
      - name: Build universal installers
        run: bash scripts/package-release.sh
      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/NextayClip.app/Contents/Info.plist)
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: NextayClip-universal-installers
          path: |
            dist/*.dmg
            dist/*.pkg
            dist/*-universal.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.dmg dist/*.pkg dist/*-universal.zip dist/SHA256SUMS.txt \
            --verify-tag --title "Nextay Clip ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md
